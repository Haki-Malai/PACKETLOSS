[project]
name = "packetloss-api"
version = "0.1.0"
description = "PACKETLOSS account and record API"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "mangum==0.22.0",
    "pydantic==2.13.5",
    "boto3==1.43.100",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
