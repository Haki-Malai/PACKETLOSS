name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Type check shared simulation and server
        run: pnpm run typecheck:server

      - name: Type check APIs
        run: pnpm run typecheck:backend

      - name: Type check development tools
        run: pnpm run typecheck:dev

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Build authoritative server artifact
        run: pnpm run build:server

      - name: Build Lambda artifacts
        run: pnpm run build:backend

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test API compatibility with the Lambda runtime
        run: node node_modules/vitest/vitest.mjs run backend

  deploy:
    needs: build
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    permissions:
      contents: read
      id-token: write
    # Before deploying this migration, publish infra and update this pin and
    # with.infra_ref together to that full SHA; the old workflow packages Python.
    uses: Haki-Malai/infra/.github/workflows/deploy-packetloss.yml@1c158f58ce77bdfdfdfcc4f96f2e80532c09973f
    with:
      stage: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
